      repo: https://github.com/OpenSettings/open-settings.git
    id: RequiresAuthentication
    path: ../../../open-settings/src/OpenSettings/Configurations/ControllerConfiguration.cs
    startLine: 55
  assemblies:
  - OpenSettings
  namespace: OpenSettings.Configurations
  summary: >-
    Indicates whether the controller requires authentication for access.  

    <p>When set to true, authentication is enforced.</p>

    <p>

    When set to false, the controller is accessible without authentication unless the service type is Consumer,  

    in which case the provider's authorization settings take precedence, and authentication may still be required.

    </p>

    <p>The default value is '<code>false</code>'.</p>
  remarks: >-
    Middleware should be registered in the following order to ensure authentication works: 

    <pre><code class="lang-csharp">app.UseRouting();

    app.UseOpenSettings();

    app.UseAuthentication();

    app.UseAuthorization();

    app.MapControllers();</code></pre>

    For more information, see <a href="https://learn.microsoft.com/en-us/aspnet/core/fundamentals/middleware/?view=aspnetcore-9.0#middleware-order">Asp.Net Core Middleware Order</a>
  example: []
  syntax:
    content: public bool RequiresAuthentication { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property RequiresAuthentication As Boolean
  overload: OpenSettings.Configurations.ControllerConfiguration.RequiresAuthentication*
