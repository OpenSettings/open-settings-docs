- uid: OpenSettings.Configurations.SyncAppDataResilienceConfiguration.MaxRetryAttempts
  commentId: P:OpenSettings.Configurations.SyncAppDataResilienceConfiguration.MaxRetryAttempts
  id: MaxRetryAttempts
