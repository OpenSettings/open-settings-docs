  langs:
  - csharp
  - vb
  name: MaxRetryAttempts
  nameWithType: SyncAppDataResilienceConfiguration.MaxRetryAttempts
  fullName: OpenSettings.Configurations.SyncAppDataResilienceConfiguration.MaxRetryAttempts
  type: Property
  source:
    remote:
      path: src/OpenSettings/Configurations/SyncAppDataResilienceConfiguration.cs
      branch: master
      repo: https://github.com/OpenSettings/open-settings.git
    id: MaxRetryAttempts
    path: ../../../open-settings/src/OpenSettings/Configurations/SyncAppDataResilienceConfiguration.cs
    startLine: 44
  assemblies:
  - OpenSettings
  namespace: OpenSettings.Configurations
  summary: >-
    Gets or sets the maximum number of retries for initial syncing data. The retry behavior is determined as follows:

    <ul><li>
            <code>0</code> or any negative value other than <code>-1</code>: No retries (operation will fail immediately on failure).
        </li><li>
            <code>-1</code>: Infinite retries (operation will continue retrying until success).
        </li><li>
            Any positive integer: Retry up to the specified number of attempts.
        </li></ul>
    <p>

    By default, the value is <code>-1</code>, which means infinite retries. Negative values other than <code>-1</code> are interpreted as "no retries" (equivalent to <code>0</code> retries), while <code>-1</code> signifies infinite retries. 

    If set to a positive value, the system will attempt the operation that many times before giving up.

    </p>

    <remarks>

    If the maximum retry attempts is reached, a <xref href="OpenSettings.Exceptions.MaxRetryExceededException" data-throw-if-not-resolved="false"></xref> will be thrown.

    </remarks>
  example: []
  syntax:
    content: public int MaxRetryAttempts { get; set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: Public Property MaxRetryAttempts As Integer
  overload: OpenSettings.Configurations.SyncAppDataResilienceConfiguration.MaxRetryAttempts*
  exceptions:
  - type: OpenSettings.Exceptions.MaxRetryExceededException
    commentId: T:OpenSettings.Exceptions.MaxRetryExceededException
    description: When the max retry attempts is reached.
