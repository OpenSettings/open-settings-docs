  namespace: OpenSettings.Configurations
  summary: >-
    Gets or sets the total timeout for the sync app data operation.

    This is the maximum time allowed for the entire operation to complete, including all retries.
  remarks: >-
    The default value is '<code>null</code>' which refer to indefinite timeout.

    If the total timeout is reached, a <xref href="OpenSettings.Exceptions.TotalTimeoutExceededException" data-throw-if-not-resolved="false"></xref> will be thrown.
  example: []
  syntax:
    content: public TimeSpan? TotalTimeout { get; set; }
